spring:
  application:
    name: thesismate
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thesismate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed by Flyway
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
