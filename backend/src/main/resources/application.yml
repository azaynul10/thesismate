thesismate:
  # Test accounts are only created with the "dev" profile (see application-dev.yml).
  seed: ${SEED_DATA:false}

spring:
  application:
    name: thesismate
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thesismate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed by Flyway
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # F11 report upload: up to 20 MB per PDF, 3 PDFs per submission (report + 2 Turnitin reports).
      max-file-size: 20MB
      max-request-size: 60MB
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true whenever the app is served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}
